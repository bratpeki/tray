name: build

on: [push, pull_request]

jobs:
  ubuntu:
    permissions: {}
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        java: [25]
          # arch: [x86_64, aarch64, riscv64]
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: sudo apt-get install makeself
      - run: ant -Dtarget.arch=${{ matrix.arch }} makeself
      - uses: actions/upload-artifact@v7
        with:
          name: qz-tray-linux-${{ matrix.arch }}
          path: out/qz-tray-*.run
      - if: ${{ matrix.arch == 'x86_64' }}
        run: |
          # Only run tests on same arch
          sudo apt-get install firefox chromium
          ant testng
          # Run policy tests again, but as root
          sudo JAVA_HOME="$JAVA_HOME" JAVACMD="$JAVA_HOME/bin/java" ant -Dtestng.pattern="**/policy/**" testng
          sudo DEBUG=true out/qz-tray-*.run
          /opt/qz-tray/qz-tray --version
          sudo apt-get install nsis
          ant nsis

      # Autotest stuff

      - name: Disable AppArmor on the GitHub runner
        uses: cisagov/action-disable-apparmor@437d94f26a2e4bf8c03acfb500a6afc688b497db

      - name: "Instaall autotest deps"
        run: "sudo apt-get install ghostscript graphicsmagick"

      - name: "Remove existing CUPS"
        run: sudo apt-get remove -yqq cups cups-pdf

      - name: "Install new CUPS"
        run: |
             sudo apt-get update
             sudo apt-get install -yqq cups-bsd cups-pdf cups-client

      - name: Print CUPS-PDF output location
        run: grep -i '^[[:space:]]*Out[[:space:]]' /etc/cups/cups-pdf.conf
        # run: cat /etc/cups/cups-pdf.conf

      - name: Manually start CUPS
        run: sudo service cups start

      - name: Check CUPS-PDF availability
        run: |
          lpstat -r
          lpstat -t | grep cups

      # Installing Node via the website commands, since the package is out-of-date?
      # https://nodejs.org/en/download
      - name: Install Node
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          \. "$HOME/.nvm/nvm.sh"
          nvm install 24
          node -v
          npm -v

      - name: Install Node Dependencies
        run: npm install
        working-directory: autotest

      - name: Create PDF output directory
        run: |
          mkdir -p "$HOME/PDF"
          chmod 1777 "$HOME/PDF"

      - run: ls "$HOME/PDF"

      - name: Run Autotest Script
        run: node test-run/start-tray.js
        working-directory: autotest

  macos:
    if: false
    runs-on: [macos-latest]
    strategy:
      matrix:
        java: [25]
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: ant -Dtarget.arch=${{ matrix.arch }} pkgbuild
      - uses: actions/upload-artifact@v7
        with:
          name: qz-tray-macos-${{ matrix.arch }}
          path: out/qz-tray-*.pkg
      - if: ${{ matrix.arch == 'aarch64' }}
        run: |
          # Only run tests on same arch
          brew install --cask google-chrome firefox
          ant testng
          # Run policy tests again, but as root
          sudo ant -Dtestng.pattern="**/policy/**" testng
          sudo installer -pkg out/qz-tray-*.pkg -target / || (cat /tmp/qz-install.log && false)
          "/Applications/QZ Tray.app/Contents/MacOS/QZ Tray" --version
          brew install nsis makeself
          ant makeself
          ant nsis

  windows:
    if: false
    runs-on: [windows-latest]
    strategy:
      matrix:
        java: [25]
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
      - run: choco install nsis
      - run: ant "-Dtarget.arch=${{ matrix.arch }}" nsis
      - uses: actions/upload-artifact@v7
        with:
          name: qz-tray-windows-${{ matrix.arch }}
          path: out/qz-tray-*.exe
      - if: ${{ matrix.arch == 'x86_64' }}
        run: |
          # Only run tests on same arch
          choco install firefox googlechrome
          ant testng
          Start-Process -Wait ./out/qz-tray-*.exe -ArgumentList "/S"
          "&'C:/Program Files/QZ Tray/qz-tray.exe' --wait --version|Out-Null"

